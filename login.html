<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Website Saya</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .login-box input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
            margin-bottom: 18px;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 45px;
        }

        .eye-btn {
            position: absolute;

            right: 10px;
            top: 12px;

            border: none;
            background: none;

            font-size: 20px;
            cursor: pointer;

            padding: 3px;
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            background: #111;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #333;
        }

        #error {
            color: red;
            text-align: center;
            margin-top: 15px;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #555;
            text-decoration: none;
        }

        .back-home:hover {
            color: #000;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Login</h1>

        <form onsubmit="login(event)">

            <!-- USERNAME -->
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="Masukkan username"
                required
            >


            <!-- PASSWORD -->
            <label for="password">Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    required
                >

                <button
                    type="button"
                    class="eye-btn"
                    onclick="togglePassword()"
                >
                    👁
                </button>

            </div>


            <!-- LOGIN -->
            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

        <p id="error"></p>

        <a href="index.html" class="back-home">
            ← Kembali ke Home
        </a>

    </div>


    <script>

        // LOGIN
        function login(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;


            // USERNAME & PASSWORD
            if (
                username === "admin" &&
                password === "12345"
            ) {

                // LANGSUNG KE GRUP BARU
                window.location.href = "grup.html";

            } else {

                document.getElementById("error").textContent =
                    "Username atau password salah!";

            }
        }


        // LIHAT PASSWORD
        function togglePassword() {

            const password =
                document.getElementById("password");

            const eye =
                document.querySelector(".eye-btn");


            if (password.type === "password") {

                password.type = "text";

                eye.textContent = "🙈";

            } else {

                password.type = "password";

                eye.textContent = "👁";

            }
        }

    </script>

</body>
</html>
